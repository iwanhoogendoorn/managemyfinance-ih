name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Verify tag matches manifest version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match manifest.json version '$MANIFEST_VERSION'."
            echo "BRAT downloads assets from releases/download/<manifest version>/, so the tag must match exactly (no 'v' prefix)."
            exit 1
          fi

      # package-lock.json is generated locally by npm 11, and npm 10 (what Node 20 ships) rejects
      # it as out of sync — verified by running `npx npm@10 ci` against a lock npm 11 had just
      # written. Pinning the major here means the version that writes the lock and the version that
      # verifies it are the same one, instead of the two taking turns invalidating each other.
      - name: Match the npm major that generates the lockfile
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
